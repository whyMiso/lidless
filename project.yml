name: Lidless
options:
  bundleIdPrefix: dev.lidless
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  LidlessCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
      ARCHS: "arm64 x86_64"
targets:
  LidlessHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper/main.swift
    dependencies:
      - package: LidlessCore
        product: LidlessCore
    settings:
      base:
        PRODUCT_NAME: LidlessHelper
        PRODUCT_BUNDLE_IDENTIFIER: dev.lidless.helper
        INFOPLIST_FILE: Helper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
  Lidless:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Helper/dev.lidless.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: LidlessCore
        product: LidlessCore
      - target: LidlessHelper
        embed: true
        codeSign: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: Lidless
        PRODUCT_BUNDLE_IDENTIFIER: dev.lidless.Lidless
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Lidless.entitlements
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Lidless:
    build:
      targets:
        Lidless: all
        LidlessHelper: all
    run:
      config: Debug
    archive:
      config: Release
